<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Citas - Barbería Mi Estilo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">Barbería Mi Estilo</div>
      <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="barbers.html">Barberos</a></li>
        <li><a href="booking.html">Reservar</a></li>
        <li><a href="citas.html">Mis Citas</a></li>
      </ul>
      <div class="nav-auth">
        <span id="user-info" style="color: var(--primary); margin-right: 1rem;"></span>
        <button class="btn btn-secondary btn-small" onclick="handleLogout()">Cerrar Sesión</button>
      </div>
    </nav>
  </header>

  <section class="section">
    <div class="container">
      <h1>Mis Citas</h1>
      <p style="color: var(--text-light); margin-bottom: 2rem;">
        Aquí están todas tus citas reservadas, Puedes gestionar tus reservas.
      </p>

      <div id="appointments-container"></div>
    </div>
  </section>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2024 Barbería Mi Estilo. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Verificar autenticación
    if (!Auth.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    // Mostrar info del usuario
    const user = Auth.getUser();
    document.getElementById('user-info').textContent = `👤 ${user.nombre}`;

    // Función para cerrar sesión
    function handleLogout() {
      Auth.logout();
      window.location.href = 'index.html';
    }

    // Cargar citas
    async function loadAppointments() {
      const container = document.getElementById('appointments-container');
      
      try {
        const response = await api.getUserAppointments();
        const { citas } = response;

        if (!citas || citas.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 3rem; background: var(--light-blue); border-radius: 8px;">
              <p style="font-size: 1.2rem; color: var(--text-light);">No tienes citas reservadas aún.</p>
              <p style="color: var(--text-light); margin-top: 1rem;">
                <a href="booking.html" class="btn btn-primary btn-small" style="text-decoration: none;">Reservar una cita</a>
              </p>
            </div>
          `;
          return;
        }

        // Agrupar citas por estado (próximas y pasadas)
        const ahora = new Date();
        const proximas = [];
        const pasadas = [];

        citas.forEach(cita => {
          const citaDate = new Date(cita.inicio_time);
          if (citaDate > ahora) {
            proximas.push(cita);
          } else {
            pasadas.push(cita);
          }
        });

        let html = '';

        // Próximas citas
        if (proximas.length > 0) {
          html += '<h2 style="color: var(--primary); margin-top: 2rem;">🟢 Próximas Citas</h2>';
          html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">';
          
          proximas.forEach(cita => {
            const fecha = new Date(cita.inicio_time);
            const fechaFormato = fecha.toLocaleDateString('es-ES', { 
              weekday: 'long', 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            });
            const horaFormato = fecha.toLocaleTimeString('es-ES', { 
              hour: '2-digit', 
              minute: '2-digit' 
            });

            html += `
              <div class="card" style="border-left: 4px solid var(--primary);">
                <h3>${cita.barbero_nombre}</h3>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>📅 Fecha:</strong> ${fechaFormato}
                </p>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>⏰ Hora:</strong> ${horaFormato}
                </p>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>✂️ Corte:</strong> ${cita.tipo_corte}
                </p>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>⏱️ Duración:</strong> ${cita.duracion_minutos} minutos
                </p>
                <div style="margin-top: 1rem;">
                  <button class="btn btn-secondary btn-small" onclick="alert('Función de cancelación próximamente')">Cancelar</button>
                </div>
              </div>
            `;
          });
          
          html += '</div>';
        }

        // Citas pasadas
        if (pasadas.length > 0) {
          html += '<h2 style="color: var(--text-light); margin-top: 2rem;">⚫ Citas Pasadas</h2>';
          html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">';
          
          pasadas.forEach(cita => {
            const fecha = new Date(cita.inicio_time);
            const fechaFormato = fecha.toLocaleDateString('es-ES', { 
              weekday: 'long', 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            });
            const horaFormato = fecha.toLocaleTimeString('es-ES', { 
              hour: '2-digit', 
              minute: '2-digit' 
            });

            html += `
              <div class="card" style="opacity: 0.7; border-left: 4px solid #ccc;">
                <h3>${cita.barbero_nombre}</h3>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>📅 Fecha:</strong> ${fechaFormato}
                </p>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>⏰ Hora:</strong> ${horaFormato}
                </p>
                <p style="color: var(--text-light); margin: 0.5rem 0;">
                  <strong>✂️ Corte:</strong> ${cita.tipo_corte}
                </p>
              </div>
            `;
          });
          
          html += '</div>';
        }

        container.innerHTML = html;

      } catch (error) {
        console.error('Error al cargar citas:', error);
        container.innerHTML = `
          <div class="test-error" style="padding: 1rem; border-radius: 8px;">
            <h3>❌ Error al cargar citas</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // Cargar citas al abrir la página
    loadAppointments();
  </script>
</body>
</html>

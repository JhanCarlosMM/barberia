<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Barbería Elite</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <nav>
      <div class="logo">✂️ Barbería Elite</div>
      <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="barbers.html">Barberos</a></li>
        <li><a href="booking.html">Reservar</a></li>
      </ul>
      <div class="nav-auth">
        <a href="login.html" class="btn btn-primary btn-small">Iniciar Sesión</a>
        <a href="register.html" class="btn btn-secondary btn-small">Registrarse</a>
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>
  </header>

  <!-- ===== CONTENT ===== -->
  <section class="section" style="min-height: 70vh;">
    <div class="container">
      <div style="max-width: 400px; margin: 0 auto;">
        <h1 class="text-center mb-4">Crear Cuenta</h1>
        
        <div id="alert-container"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre" required>
            <div class="form-error">Nombre requerido</div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required>
            <div class="form-error">Email inválido</div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            <div class="form-error">Mínimo 6 caracteres</div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmar Contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="••••••••" required>
            <div class="form-error">Las contraseñas no coinciden</div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
        </form>

        <div class="text-center mt-4">
          <p>¿Ya tienes cuenta? <a href="login.html"><strong>Inicia sesión aquí</strong></a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2024 Barbería Elite. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById('register-form');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const validationRules = {
        nombre: { required: true },
        email: { required: true, email: true },
        password: { required: true, minLength: 6 },
        'confirm-password': { required: true, match: 'password' }
      };

      if (!FormValidator.validateForm(validationRules)) {
        return;
      }

      const { nombre, email, password } = getFormData('register-form');
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.textContent;

      try {
        btn.disabled = true;
        btn.textContent = 'Cargando...';

        const response = await api.register(nombre, email, password);
        
        UI.showAlert('Cuenta creada correctamente. Redirigiendo...', 'success', 2000);
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        UI.showAlert(error.message || 'Error al crear la cuenta', 'danger');
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  </script>
</body>
</html>
